[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "limo-directory-scraper"
version = "1.0.0"
description = "Limo & party bus directory scraper"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["scraper*", "api*", "config*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]